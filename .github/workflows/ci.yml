name: Queue CI and publication

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r part2/requirements-dev.txt
      - run: ruff check part2/app
      - name: Lint runtime Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < part2/Dockerfile

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive one stable version from this commit
        id: version
        run: echo "version=v$(git show -s --format=%cs HEAD)-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build without publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" -t lab-queue:build part2
      - name: Export the exact built image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o "$RUNNER_TEMP/lab-queue.tar" lab-queue:build
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: lab-queue-image
          path: ${{ runner.temp }}/lab-queue.tar
          retention-days: 1
          if-no-files-found: error

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sadrashadmehry/lab-queue
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lab-queue-image
          path: ${{ runner.temp }}/image
      - name: Authenticate using the workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish or reuse the existing release image
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$GITHUB_SHA"
            docker pull "$IMAGE:$VERSION"
            test "$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          else
            docker load -i "$RUNNER_TEMP/image/lab-queue.tar"
            docker tag lab-queue:build "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  tag:
    needs: [build, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create an annotated tag once without moving it
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git cat-file -t "refs/tags/$VERSION")" = tag
            test "$(git rev-parse "$VERSION^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION; commit $GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi

  pages:
    needs: [build, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Render only the publication copy
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python part2/tools/render_site.py "$VERSION" "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy static page
        id: deployment
        uses: actions/deploy-pages@v5
