name: Deploy a selected Pages version
run-name: Deploy Pages tag ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exactly the requested tag (fail if missing)
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source commit and render the selected version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          printf 'Selected tag: %s\n' "$TAG"
          git log -1 --format='Source commit: %H'
          python part2/tools/render_site.py "$TAG" "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy selected static page
        id: deployment
        uses: actions/deploy-pages@v5
